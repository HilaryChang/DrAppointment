<title>&#21363;&#23559;&#30475;&#35386;&#65372;&#38928;&#32004;&#28165;&#21934;</title>
<style>
:root{font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#20312e;background:#f4f6f4;--green:#23594f;--mint:#e5f0ec;--line:#e0e8e4;--muted:#74827d;--panel:#fff}*{box-sizing:border-box}body{margin:0;min-width:320px}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1600px)/2 + 22px));gap:12px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--mint);font-size:30px}.brand strong{display:block;font-size:22.5px}.brand small{display:block;color:var(--muted);font-size:16.5px;margin-top:3px}.language-toggle{border:1px solid var(--line);border-radius:8px;background:#fff;color:#34534a;padding:8px 11px;font:inherit;font-size:18px;font-weight:650;cursor:pointer}.page{max-width:1180px;margin:auto;padding:38px 22px 56px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}.intro h1{font-size:42px;letter-spacing:-.04em;margin:0 0 8px}.intro p{margin:0;color:var(--muted);font-size:19.5px}.count{flex:none;background:var(--mint);color:var(--green);border-radius:20px;padding:8px 12px;font-size:18px;font-weight:650}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1100px;table-layout:fixed;text-align:left}thead tr{height:66px}th{height:66px;padding:8px 10px;background:#fafbfa;color:#778680;font-size:16.5px;font-weight:650;white-space:normal;overflow:hidden;text-overflow:ellipsis;line-height:1.25;vertical-align:middle}tbody tr{height:78px}td{height:78px;padding:10px;border-top:1px solid #edf1ef;font-size:19.5px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th:first-child,td:first-child{padding-left:18px}.date{font-weight:700;white-space:nowrap;color:#253b36}.time{display:inline-flex;padding:5px 9px;border-radius:20px;background:#f1f5f3;color:#47645b;font-size:16.5px;font-weight:650;white-space:nowrap}.time.am{background:#fff2d9;color:#946117}.time.pm{background:#e8f0ff;color:#3d5f9a}.hospital{font-weight:700;white-space:nowrap}.queue{font-variant-numeric:tabular-nums;font-weight:700;color:var(--green);white-space:nowrap}.location{color:#52645e;white-space:nowrap}.transport{min-width:0}.transport-lines{font-size:16.5px;line-height:1.4;color:#52645e;white-space:normal}.transport-lines div+div{margin-top:2px}.transport-empty{display:inline-flex;align-items:center;gap:7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8a9691;font-size:18px}.transport-empty:before{content:"";width:7px;height:7px;flex:none;border-radius:50%;background:#c6cfcb}.footer{padding:13px 18px;border-top:1px solid var(--line);color:#87928e;font-size:16.5px}.mobile-list{display:none}.appointment{padding:16px;border-bottom:1px solid var(--line)}.appointment:last-child{border-bottom:0}.appt-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}.appt-info{display:grid;grid-template-columns:1fr 1fr;gap:11px 9px}.item-label{display:block;color:#89958f;font-size:15px;margin-bottom:3px}.item-value{font-size:18px;line-height:1.45}.appt-transport{background:#f8faf9;margin:12px -2px 0;padding:10px 9px;border:1px solid #edf1ef;border-radius:8px}.appt-transport .transport-empty{font-size:16.5px}

<body>
<section class="pin-gate" id="pin-gate" aria-labelledby="pin-title"><form class="pin-card" id="pin-form"><div class="pin-card-head"><div class="pin-icon" aria-hidden="true">🔒</div><button type="button" id="pin-language-toggle" class="language-toggle">Indonesia</button></div><h1 id="pin-title">請輸入密碼</h1><p id="pin-description">輸入 4 位數密碼以查看看診清單</p><input class="pin-input" id="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="4 位數密碼" required><button class="pin-submit" id="pin-submit" type="submit">確認</button><p class="pin-error" id="pin-error" role="alert"></p></form></section>
<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true">🕗</span><div><strong id="brand-title"></strong><small id="brand-subtitle"></small></div></div><button type="button" id="language-toggle" class="language-toggle">Indonesia</button></header>
<main class="page"><section class="intro"><div><h1 id="heading"></h1><p id="description"></p></div><span class="count" id="count"></span></section><section class="card desktop-table"><div class="table-wrap"><table><colgroup><col style="width:15%"><col style="width:6%"><col style="width:6%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:6%"><col style="width:6%"><col style="width:8%"><col style="width:5%"><col style="width:21%"></colgroup><thead><tr id="headings"></tr></thead><tbody id="rows"></tbody></table></div><div class="footer" id="desktop-footer"></div></section><section class="card mobile-list" id="cards"></section></main>
<script>
(()=>{let lang=localStorage.getItem('dr-appointment-language')||'zh';const gate=document.querySelector('#pin-gate'),form=document.querySelector('#pin-form'),input=document.querySelector('#pin-input');const syncPinLanguage=()=>{const zh=lang==='zh';document.documentElement.lang=zh?'zh-Hant':'id';document.querySelector('#pin-title').textContent=zh?'請輸入密碼':'Masukkan Kata Sandi';document.querySelector('#pin-description').textContent=zh?'輸入 4 位數密碼以查看看診清單':'Masukkan PIN 4 digit untuk melihat jadwal berobat';document.querySelector('#pin-submit').textContent=zh?'確認':'Konfirmasi';document.querySelector('#pin-input').setAttribute('aria-label',zh?'4 位數密碼':'PIN 4 digit');document.querySelector('#pin-language-toggle').textContent=zh?'Indonesia':'中文'};syncPinLanguage();document.querySelector('#pin-language-toggle').addEventListener('click',()=>{lang=lang==='zh'?'id':'zh';localStorage.setItem('dr-appointment-language',lang);syncPinLanguage();render()});if(localStorage.getItem('dr-appointment-unlocked')==='true')gate.hidden=true;else input.focus();form.addEventListener('submit',e=>{e.preventDefault();if(input.value==='2025'){localStorage.setItem('dr-appointment-unlocked','true');gate.hidden=true}else{document.querySelector('#pin-error').textContent=lang==='zh'?'密碼錯誤，請再試一次':'PIN salah, silakan coba lagi';input.value='';input.focus()}});const appts=[

];const text={zh:{title:'\u5373\u5c07\u770b\u8a3a',subtitle:'\u9810\u7d04\u6e05\u55ae',heading:'\u8fd1\u671f\u770b\u8a3a\u5b89\u6392',description:'\u770b\u8a3a\u8cc7\u8a0a\u8207\u4ea4\u901a\u8eca\u9810\u7d04\u4e00\u89bd',count:'7 \u7b46\u9810\u7d04',patient:'\u770b\u8a3a\u4eba',floorLabel:'',labels:['\u65e5\u671f','\u770b\u8a3a\u4eba','\u6642\u6bb5','\u91ab\u9662','\u79d1\u5225','\u91ab\u5e2b','\u8a3a\u9593','\u5e8f\u865f','\u4f4d\u7f6e','\u6a13\u5c64','\u4ea4\u901a\u8eca\u9810\u7d04\uff0f\u53bb\u7a0b\u8207\u56de\u7a0b'],am:'\u4e0a\u5348',pm:'\u4e0b\u5348',days:['\u65e5','\u4e00','\u4e8c','\u4e09','\u56db','\u4e94','\u516d'],depts:['\u76ae\u819a\u79d1','\u75bc\u75db\u63a7\u5236\u79d1','\u7121','\u53e3\u8154\u5916\u79d1','\u624b\u5916\u79d1','\u795e\u7d93\u5167\u79d1','\u795e\u7d93\u5167\u79d1'],go:'\u53bb\u7a0b',back:'\u56de\u7a0b',vehicleLabel:'\u8eca\u865f',pending:'\u5f85\u63d0\u4f9b',empty:'\u5c1a\u672a\u63d0\u4f9b\u4ea4\u901a\u8eca\u8cc7\u8a0a',footer:'\u4ea4\u901a\u8eca\u6b04\u4f4d\u9810\u7559\u53bb\u7a0b\uff0f\u56de\u7a0b\u6642\u9593\u3001\u8eca\u865f\u8207\u8eca\u8272'},id:{title:'Jadwal Berobat',subtitle:'Daftar Janji Temu',heading:'Jadwal Kunjungan Mendatang',description:'Informasi kunjungan dan pemesanan kendaraan',count:'7 janji temu',patient:'Pasien',floorLabel:'Lantai ',labels:['Tanggal','Pasien','Waktu','Rumah Sakit','Spesialisasi','Dokter','Ruang','Nomor antrean','Lokasi','Lantai','Kendaraan / Pergi dan Pulang'],am:'Pagi',pm:'Sore',days:['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],depts:['Dermatologi','Manajemen Nyeri','Tidak ada','Bedah Mulut','Bedah Tangan','Neurologi','Neurologi'],go:'Pergi',back:'Pulang',vehicleLabel:'No. Kendaraan',pending:'Akan diberikan',empty:'Informasi kendaraan belum tersedia',footer:'Kolom kendaraan disiapkan untuk waktu pergi/pulang, nomor, dan warna kendaraan'}};const $=s=>document.querySelector(s);function dateLabel(date,t){const [y,m,d]=date.split('-').map(Number),day=new Date(y,m-1,d,12).getDay();return `${date}（${t.days[day]}）`}function transportHtml(a,t){return a.transport?`<div class="transport-lines"><div>${t.go} ${a.transport.go}｜${t.vehicleLabel}：${t.pending}</div><div>${t.back} ${a.transport.back}｜${t.vehicleLabel}：${t.pending}</div></div>`:`<span class="transport-empty">${t.empty}</span>`}function render(){const t=text[lang],now=new Date(),today=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');document.documentElement.lang=lang==='zh'?'zh-Hant':'id';$('#brand-title').textContent=t.title;$('#brand-subtitle').textContent=t.subtitle;$('#heading').textContent=t.heading;$('#description').textContent=t.description;$('#count').textContent=t.count;$('#language-toggle').textContent=lang==='zh'?'Indonesia':'\u4e2d\u6587';$('#headings').innerHTML=t.labels.map(x=>`<th>${x}</th>`).join('');$('#rows').innerHTML=appts.map((a,i)=>`<tr class="${a.date<today?'past':''}"><td class="date">${dateLabel(a.date,t)}</td><td>${a.patient}</td><td><span class="time ${a.period}">${t[a.period]}</span></td><td class="hospital">${a.hospital}</td><td>${t.depts[i]}</td><td>${a.doctor}</td><td>${a.room}</td><td class="queue">${a.queue}</td><td class="location">${a.location}</td><td>${t.floorLabel}${a.floor}</td><td class="transport">${transportHtml(a,t)}</td></tr>`).join('');$('#cards').innerHTML=appts.map((a,i)=>`<article class="appointment ${a.date<today?'past':''}"><div class="appt-top"><span class="date">${dateLabel(a.date,t)}</span><span class="time ${a.period}">${t[a.period]}</span></div><div class="appt-info"><div><span class="item-label">${t.labels[3]}</span><span class="item-value hospital">${a.hospital}</span></div><div><span class="item-label">${t.patient}</span><span class="item-value">${a.patient}</span></div><div><span class="item-label">${t.labels[4]}／${t.labels[5]}</span><span class="item-value">${t.depts[i]}・${a.doctor}</span></div><div><span class="item-label">${t.labels[6]}／${t.labels[7]}</span><span class="item-v
